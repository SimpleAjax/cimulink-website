  <script>
    // Initialize Showdown converter
    const converter = new showdown.Converter();
    converter.setOption('ghCompatibleHeaderId', true);
    converter.setOption('simpleLineBreaks', true);
    converter.setOption('openLinksInNewWindow', true);

    // Function to parse frontmatter from markdown content
    function parseFrontmatter(content) {
      const frontmatter = {};
      if (content.startsWith('---')) {
        const end = content.indexOf('---', 3);
        if (end !== -1) {
          const frontmatterContent = content.substring(3, end);
          const lines = frontmatterContent.split('\n');
          lines.forEach(line => {
            const colonIndex = line.indexOf(':');
            if (colonIndex !== -1) {
              const key = line.substring(0, colonIndex).trim();
              let value = line.substring(colonIndex + 1).trim();
              // Remove quotes if present
              if (value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length - 1);
              }
              frontmatter[key] = value;
            }
          });
          // Return content without frontmatter
          return { frontmatter, content: content.substring(end + 3).trim() };
        }
      }
      // No frontmatter found, return original content
      return { frontmatter, content };
    }

    // Function to get URL parameter
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Function to load a file
    function loadFile(url, callback) {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            callback(null, xhr.responseText);
          } else {
            callback(new Error('Failed to load file: ' + url), null);
          }
        }
      };
      xhr.send();
    }

    // Function to load blog content
    function loadBlogContent(fileName) {
      const blogContentDiv = document.getElementById('blog-content');
      
      if (!fileName) {
        blogContentDiv.innerHTML = '<h1>Blog Not Found</h1><p>Sorry, the requested blog post could not be found.</p>';
        return;
      }
      
      // Load the actual markdown file
      loadFile('blogs/' + fileName + '/index.md', function(error, content) {
        if (error) {
          console.error(error);
          blogContentDiv.innerHTML = '<h1>Error Loading Blog</h1><p>Sorry, there was an error loading the blog post content.</p>';
          return;
        }
        
        // Parse frontmatter if present
        const { frontmatter, content: markdownContent } = parseFrontmatter(content);
        
        // Parse the markdown content using Showdown
        const htmlContent = converter.makeHtml(markdownContent);
        
        // Extract metadata
        const title = frontmatter.title || fileName.replace('.md', '').replace(/-/g, ' ');
        const date = frontmatter.date || 'August 18, 2025';
        const author = frontmatter.author || 'Cimulink Team';
        
        // Create metadata header
        const metadataHeader = `
          <div class="blog-meta">
            <p class="blog-date"><em>Published on ${date}</em></p>
            <p class="blog-author"><em>By ${author}</em></p>
          </div>
        `;
        
        // Insert the content with metadata
        blogContentDiv.innerHTML = metadataHeader + htmlContent;
      });
    }

    // Initialize the blog post page
    document.addEventListener('DOMContentLoaded', function() {
      const fileName = getUrlParameter('file');
      loadBlogContent(fileName);
    });
  </script>
